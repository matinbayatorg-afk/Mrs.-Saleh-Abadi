<!doctype html>

<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>تقدیم به تو — سورپرایز</title>
  <style>
    :root{
      --bg1:#0f172a;
      --bg2:#071024;
      --accent:#ff6b6b;
      --glass: rgba(255,255,255,0.06);
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;font-family: "Vazirmatn", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;}
    body{
      background: radial-gradient(1200px 800px at 10% 10%, rgba(255,107,107,0.07), transparent),
                  linear-gradient(180deg,var(--bg1),var(--bg2));
      color:#fff;display:flex;align-items:center;justify-content:center;padding:20px;
      -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
    }
    .stage{width:100%;max-width:980px;min-height:560px;background:linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.02));border-radius:20px;padding:28px;box-shadow:0 10px 40px rgba(0,0,0,0.6);position:relative;overflow:hidden}/* Landing overlay */
.landing{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;background:linear-gradient(180deg, rgba(7,16,36,0.9), rgba(9,12,26,0.6));backdrop-filter: blur(6px);transition:all .7s ease;z-index:30}
.landing.hidden{opacity:0;transform:translateY(-12px);pointer-events:none}
.landing h1{font-size:34px;margin:0 0 14px 0;text-align:center}
.landing p{opacity:0.85;margin:0 0 22px 0}
.cta{display:inline-flex;align-items:center;gap:12px;background:linear-gradient(90deg,var(--accent),#ffd166);color:#071024;padding:10px 18px;border-radius:12px;font-weight:700;cursor:pointer;box-shadow:0 6px 18px rgba(255,107,107,0.12)}
.subtext{font-size:13px;margin-top:10px;opacity:0.9}

/* Main area */
.controls{display:flex;gap:12px;align-items:center;position:absolute;left:24px;top:24px;z-index:20}
.btn{background:var(--glass);border:1px solid rgba(255,255,255,0.04);padding:8px 12px;border-radius:10px;cursor:pointer}
.btn.primary{background:linear-gradient(90deg,var(--accent),#ff9a9a);color:#071024;font-weight:700}
.btn:active{transform:translateY(1px)}

.grid-area{height:100%;display:flex;align-items:center;justify-content:center;}
.puzzle{width:min(560px,86%);aspect-ratio:1/1;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:8px;border-radius:18px;background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));box-shadow:inset 0 2px 12px rgba(0,0,0,0.6);position:relative}
.tile{background-size:300% 300%;background-repeat:no-repeat;border-radius:10px;overflow:hidden;display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer;transition:transform .45s cubic-bezier(.2,.9,.2,1),filter .3s}
.tile::after{content:"";position:absolute;inset:0;box-shadow:inset 0 2px 0 rgba(255,255,255,0.03), inset 0 -6px 18px rgba(0,0,0,0.5);border-radius:10px}
.tile:hover{transform:translateY(-6px) scale(1.02);filter:brightness(1.03)}

.assembled{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.assembled .frame{width:320px;height:320px;border-radius:14px;overflow:hidden;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:8px;background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(0,0,0,0.18));transform-origin:center;transition:transform .6s cubic-bezier(.2,.9,.2,1)}
.rotating{animation:spin 6s linear infinite}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}

/* top-right info panel */
.info{position:absolute;top:24px;right:24px;text-align:right;z-index:20}
.info h3{margin:0 0 6px 0}
.small{font-size:13px;color:rgba(255,255,255,0.85)}

/* modal */
.modal{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(2,6,23,0.6);z-index:60;opacity:0;pointer-events:none;transition:opacity .25s}
.modal.open{opacity:1;pointer-events:auto}
.sheet{background:linear-gradient(180deg,#071024,#0b1320);padding:22px;border-radius:14px;max-width:760px;width:92%;max-height:80vh;overflow:auto}
.sheet h2{margin-top:0}
.texts{display:flex;flex-direction:column;gap:8px}
.text-item{background:rgba(255,255,255,0.02);padding:10px;border-radius:8px}

/* file input */
.upload{position:absolute;left:24px;bottom:24px;z-index:20}
input[type=file]{display:none}

/* responsive */
@media (max-width:720px){.puzzle{width:86%;gap:6px}.assembled .frame{width:260px;height:260px}}

  </style>
</head>
<body>
  <div class="stage" id="stage"><div class="landing" id="landing">
  <h1>تقدیم به تو که...</h1>
  <p>روی متن ضربه بزن تا سورپرایز شروع شود.</p>
  <div class="cta" id="startBtn">تقدیم به تو که...</div>
  <div class="subtext">(این صفحه قابل شخصی‌سازی است — عکس خودت را آپلود کن)</div>
</div>

<div class="controls">
  <div class="btn" id="textsBtn">متن‌ها</div>
  <div class="btn primary" id="playBtn">► پخش / توقف</div>
  <label class="btn" for="fileInp">آپلود عکس</label>
  <div class="upload"><input id="fileInp" type="file" accept="image/*"/></div>
</div>

<div class="info">
  <h3 id="title">وقتی عکست کامل شد، دکمهٔ پخش رو بزن</h3>
  <div class="small">می‌تونی عکس رو آپلود کنی یا آدرس عکس رو در کد تغییر بدی</div>
</div>

<div class="grid-area">
  <div class="puzzle" id="puzzle">
    <!-- 9 tiles -->
    <!-- data-pos: row-col index for background positioning -->
    <div class="tile" data-row="0" data-col="0" data-index="1"></div>
    <div class="tile" data-row="0" data-col="1" data-index="2"></div>
    <div class="tile" data-row="0" data-col="2" data-index="3"></div>
    <div class="tile" data-row="1" data-col="0" data-index="4"></div>
    <div class="tile" data-row="1" data-col="1" data-index="5"></div>
    <div class="tile" data-row="1" data-col="2" data-index="6"></div>
    <div class="tile" data-row="2" data-col="0" data-index="7"></div>
    <div class="tile" data-row="2" data-col="1" data-index="8"></div>
    <div class="tile" data-row="2" data-col="2" data-index="9"></div>
  </div>

  <!-- assembled hidden version to rotate the full image -->
  <div class="assembled" id="assembled" aria-hidden="true" style="display:none;">
    <div class="frame" id="frame"></div>
  </div>

</div>

<!-- hidden audio (replace src with your chosen mp3 hosted in repo) -->
<audio id="music" src="" preload="auto"></audio>

<!-- modal for texts -->
<div class="modal" id="modal">
  <div class="sheet">
    <h2>جملات «تقدیم به تو که...»</h2>
    <div class="texts" id="textsContainer"></div>
    <div style="margin-top:12px;text-align:left"><button class="btn" id="closeModal">بستن</button></div>
  </div>
</div>

  </div>  <script>
    // ====== CONFIG: replace these defaults if you want a shipped demo ======
    const DEFAULT_IMAGE = '';
    const DEFAULT_MUSIC = '';
    // A ready-made list of sentences (from our conversation) — you can edit/expand
    const SENTENCES = [
      'از من در من فراوان‌تری.',
      'دلیل گریه‌ی شب‌های منی.',
      'بی‌آنکه بخواهی، آرامِ دلمی.',
      'هر سکوتت هزار جمله ناگفته در من می‌نویسد.',
      'با خنده‌ات جهان من زیباتر می‌شود.',
      'نمی‌دانی، اما نفس‌هایم بوی تو را می‌دهد.',
      'وقتی نیستی، انگار هیچ صدایی شنیدنی نیست.',
      'در میان هزاران چهره، نگاه من فقط دنبال توست.',
      'بی‌خبر از من، تمام شعرهایت را از تو نوشته‌ام.',
      'تویی که با یک نگاهت، نظم جهان من به‌هم می‌ریزد.',
      'آرامشی که حتی دعاهایم هم بلد نیستند توصیفش کنند.',
      'هر شب که نمی‌خوابم، تو از میان خوابم رد می‌شوی.',
      'بی‌دعای تو، روزهایم بوی ملال می‌گیرد.',
      'کاش می‌دانستی چقدر در دلم حرف‌های نگفته داری.',
      'در من صدایی هست که فقط با نام تو آرام می‌گیرد.',
      'بودنِ ساده‌ات، عجیب‌ترین معجزه‌ی زندگی من است.',
      'تو همان لبخندی هستی که از دل خستگی روی لبم می‌نشیند.',
      'تمام مسیرهایم بی‌دلیل به سوی تو ختم می‌شوند.',
      'حتی وقتی نیستی، نبودنت را زندگی می‌کنم.',
      'تو را نه با چشم، با دل دیده‌ام.',
      'تو همان اتفاق آرامی هستی که هر روز دلم می‌خواهد تکرار شود.',
      'با هر تپش دلم، نامت تکرار می‌شود.',
      'در من چیزی هست که فقط با تو زنده است.',
      'تو را نمی‌نویسم، تو را زندگی می‌کنم.',
      'در هر «بی‌کسی»، رد پای مهربانی تو پیداست.',
      'سکوت من پر از فریاد نام توست.',
      'هیچ رویایی از تو قشنگ‌تر نیست.',
      'صدایت، لالاییِ ناآرام‌ترین شب‌های من است.',
      'تو آغازِ شعرِ دلی هستی که بی‌پایان تو را می‌نویسد.',
      'به تو که بی‌آنکه بدانی، معنای دوست‌داشتن شدی.',
      'به تو که هر بار نگاهت، دل را به سفر می‌برد.',
      'به تو که خستگی دنیا با بودنت بی‌معنا می‌شود.',
      'به تو که حتی خیالِ بودنت، زندگی‌ست.',
      'به تو که «من» در مقابلت کم می‌آورد.',
      'به تو که دل از من بردی، بی‌آنکه نگاهی طلب کرده باشی.',
      'به تو که حضورت را هیچ واژه‌ای جا نمی‌دهد.',
      'به تو که ساده‌ای و همین سادگی، پیچیده‌ترین حس دنیاست.',
      'به تو که هرچه بنویسم، باز کم است.',
      'به تو که اگر بدانی، جهان دیگری خواهی شد برایم.',
      'به تو که بی‌خبر از این همه حس قشنگی در منی...'
    ];

    // ====== UI Hookups ======
    const landing = document.getElementById('landing');
    const startBtn = document.getElementById('startBtn');
    const puzzle = document.getElementById('puzzle');
    const frame = document.getElementById('frame');
    const assembled = document.getElementById('assembled');
    const playBtn = document.getElementById('playBtn');
    const music = document.getElementById('music');
    const textsBtn = document.getElementById('textsBtn');
    const modal = document.getElementById('modal');
    const textsContainer = document.getElementById('textsContainer');
    const closeModal = document.getElementById('closeModal');
    const fileInp = document.getElementById('fileInp');

    // fill modal
    SENTENCES.forEach(s=>{
      const div = document.createElement('div');div.className='text-item';div.textContent=s;textsContainer.appendChild(div);
    });

    // default image & music (if provided)
    let imgURL = DEFAULT_IMAGE;
    let musicURL = DEFAULT_MUSIC;
    if(musicURL){music.src = musicURL}

    // helper to apply background positions
    function applyImageToTiles(url){
      imgURL = url || imgURL;
      const tiles = puzzle.querySelectorAll('.tile');
      tiles.forEach(t=>{
        const r = parseInt(t.dataset.row,10);
        const c = parseInt(t.dataset.col,10);
        t.style.backgroundImage = `url(${imgURL})`;
        // Because background-size is 300% for a 3x3 grid, positions are 0%,50%,100%
        t.style.backgroundPosition = `${c*50}% ${r*50}%`;
      });
      // assembled full-frame
      buildAssembledFrame(imgURL);
    }

    function buildAssembledFrame(url){
      frame.innerHTML='';
      // create 9 small divs to show whole image as one element but keep structure for rotation
      for(let r=0;r<3;r++){
        for(let c=0;c<3;c++){
          const d = document.createElement('div');
          d.style.backgroundImage = `url(${url})`;
          d.style.backgroundSize = '300% 300%';
          d.style.backgroundPosition = `${c*50}% ${r*50}%`;
          d.style.borderRadius='8px';
          d.style.boxShadow='inset 0 2px 0 rgba(255,255,255,0.02)';
          frame.appendChild(d);
        }
      }
    }

    // start button
    startBtn.addEventListener('click', ()=>{
      landing.classList.add('hidden');
      setTimeout(()=>{landing.style.display='none';},700);
      // show assembled preview and tiles
      assembled.style.display='flex';
      assembled.style.pointerEvents='none';
    });

    // play button toggles music + rotation
    let playing=false;
    playBtn.addEventListener('click', async ()=>{
      // if no image, flash instruction
      if(!imgURL){
        alert('لطفاً ابتدا عکس را آپلود کنید یا آدرس تصویر را در کد قرار دهید.');
        return;
      }
      if(!music.src){
        // try to play without music: only rotate the frame
        toggleRotation();
        return;
      }
      if(!playing){
        try{
          await music.play();
          toggleRotation(true);
          playing=true;
          playBtn.textContent='■ توقف';
        }catch(e){
          // autoplay might be blocked — fall back to just start rotation
          toggleRotation(true);
          playing=true;playBtn.textContent='■ توقف';
        }
      }else{
        music.pause();music.currentTime=0;
        toggleRotation(false);
        playing=false;playBtn.textContent='► پخش / توقف';
      }
    });

    function toggleRotation(on){
      if(on){
        frame.classList.add('rotating');
      }else{
        frame.classList.remove('rotating');
      }
    }

    // texts modal
    textsBtn.addEventListener('click', ()=>{modal.classList.add('open')});
    closeModal.addEventListener('click', ()=>{modal.classList.remove('open')});
    modal.addEventListener('click',(e)=>{if(e.target===modal)modal.classList.remove('open')});

    // file input -> read image
    fileInp.addEventListener('change', ev=>{
      const f = ev.target.files && ev.target.files[0];
      if(!f) return;
      const reader = new FileReader();
      reader.onload = function(e){
        applyImageToTiles(e.target.result);
      }
      reader.readAsDataURL(f);
    });

    // init with placeholder if provided
    if(DEFAULT_IMAGE) applyImageToTiles(DEFAULT_IMAGE);

    // small UX: clicking any tile will open assembled large view momentarily
    puzzle.addEventListener('click', ()=>{
      assembled.style.display='flex';
      assembled.style.opacity=1;
      setTimeout(()=>assembled.style.opacity=1,10);
    });

    // keyboard: space toggles play
    window.addEventListener('keydown',(e)=>{if(e.code==='Space'){e.preventDefault();playBtn.click()}});

    // End of script
  </script></body>
</html>
